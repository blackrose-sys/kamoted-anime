name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: |
          npx cap sync android --verbose > sync_log.txt 2>&1 || true
          cat sync_log.txt
          echo "### Capacitor Sync Log" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat sync_log.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if grep -q "failed" sync_log.txt || grep -q "error" sync_log.txt || [ ! -f "android/app/src/main/assets/capacitor.config.json" ]; then
            echo "Capacitor Sync Failed"
            ERROR_MSG=$(tail -n 25 sync_log.txt | tr '\n' ' ' | tr -d '"' | tr -d "'")
            echo "::error::Capacitor Sync Failed: $ERROR_MSG"
            exit 1
          fi

      - name: Build Android App (Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
